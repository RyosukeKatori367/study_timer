<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>グミ勉 ルールの確かめ</title>
    <style>
      body { background: #000; color: #eee; font: 15px/1.6 system-ui, sans-serif; margin: 0; padding: 20px; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { color: #aaa; margin: 0 0 16px; }
      button { font: inherit; padding: 12px 20px; border-radius: 12px; border: 0; background: #338ced; color: #fff; }
      #status { margin: 16px 0 8px; font-weight: 700; }
      #status.ok { color: #3ddc84; }
      #status.ng { color: #ff6b6b; }
      ul { list-style: none; padding: 0; margin: 0; }
      li { padding: 4px 0; border-bottom: 1px solid #222; font-size: 14px; }
      li.ng { color: #ff6b6b; }
    </style>
  </head>
  <body>
    <h1>セキュリティルールの確かめ</h1>
    <p>テスト用のアカウントを3つ作って、グループ・投稿・バックアップの読み書きを確かめます。終わったらテスト用のデータとアカウントは消します。今のログインには影響しません。</p>
    <button id="run">確かめる</button>
    <div id="status"></div>
    <ul id="out"></ul>
    <script type="module" src="/src/cloud/selftest.ts"></script>
  </body>
</html>
