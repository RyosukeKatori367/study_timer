<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>グミ勉</title>
    <meta name="description" content="勉強用タイマー" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="グミ勉" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  </head>
  <body>
    <div id="app">
      <div class="views">
        <!-- 中央: 横スワイプで3つのモードを切り替える -->
        <main class="view active" data-view="main">
          <button type="button" class="help-btn" aria-label="使い方">?</button>
          <div id="pager">
            <section class="page" data-mode="pomodoro" aria-label="ポモドーロ"></section>
            <section class="page" data-mode="timer" aria-label="タイマー"></section>
            <section class="page" data-mode="stopwatch" aria-label="ストップウォッチ"></section>
          </div>
        </main>
        <main class="view scroll" data-view="stats"></main>
        <main class="view scroll" data-view="group"></main>
        <main class="view scroll" data-view="event"></main>
        <main class="view scroll" data-view="my"></main>
        <main class="view scroll" data-view="style"></main>
        <main class="view scroll" data-view="settings"></main>
      </div>

      <footer id="chrome">
        <div id="dots" aria-hidden="true"><span></span><span></span><span></span></div>
        <nav aria-label="メニュー">
          <button type="button" data-view="stats" aria-label="統計">
            <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 20v-5M12 20V9M18 20V4" /></svg>
          </button>
          <button type="button" data-view="main" aria-label="タイマー">
            <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg>
          </button>
          <button type="button" data-view="group" aria-label="グループ">
            <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2" /><circle cx="17" cy="9.5" r="2.4" /><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M15.5 14.2c2.9-.4 5.5 1.4 5.5 4.3" /></svg>
          </button>
          <button type="button" data-view="event" aria-label="ホーム">
            <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.8l8.5 6.7" /><path d="M5.8 9v10.2h4.4v-5.4h3.6v5.4h4.4V9" /></svg>
          </button>
          <button type="button" data-view="my" aria-label="マイページ">
            <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4" /><path d="M4.5 20c0-4 3.4-6.5 7.5-6.5s7.5 2.5 7.5 6.5" /></svg>
          </button>
        </nav>
      </footer>

      <!-- 計測中の画面（全画面でかぶせるので、計測中は横スワイプできない） -->
      <div id="run" hidden></div>
      <div id="sheet" hidden></div>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
